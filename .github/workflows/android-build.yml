name: Build Android (APK + AAB)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: Install deps
        run: bun install

      - name: Build web
        run: bun run build

      - name: Capacitor sync
        run: bunx cap sync android

      # Firma opzionale: aggiungi i secrets nel repo per ottenere AAB firmato.
      # ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
      - name: Decode keystore (se presente)
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ciclaqui.keystore"
            echo "path=$RUNNER_TEMP/ciclaqui.keystore" >> "$GITHUB_OUTPUT"
          else
            echo "Nessun keystore configurato: build release non firmata."
            echo "path=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build debug APK (installabile subito)
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Build release AAB (per Play Console)
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: ciclaqui-android
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
